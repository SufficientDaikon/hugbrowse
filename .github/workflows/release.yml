name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HugBrowse ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/SufficientDaikon/hugbrowse/blob/master/CHANGELOG.md) for details.

            ## Installation
            - **NSIS Installer** (.exe) — Recommended for most users
            - **MSI Installer** (.msi) — For IT/enterprise deployment

            Existing installations will auto-update within 24 hours, or check manually in Settings → About.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
