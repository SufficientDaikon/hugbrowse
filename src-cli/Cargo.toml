[package]
name = "hb"
version = "1.0.0"
description = "HugBrowse CLI — headless model management, chat, and API server control"
edition = "2021"

[[bin]]
name = "hb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
