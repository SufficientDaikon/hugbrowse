[package]
name = "hugbrowse"
version = "0.3.0"
description = "HugBrowse - Hugging Face Model Hub Browser"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
sysinfo = "0.35"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"

# Phase 2: API Server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Phase 4: Configuration
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"

# Tauri best-practice profiles: https://v2.tauri.app/concept/size/
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
